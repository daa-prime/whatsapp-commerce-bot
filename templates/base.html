<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ShopTransact{% endblock %}</title>
<style>
  :root {
    /* ShopTransact brand -- pink/magenta */
    --color-primary: #D6006F;
    --color-primary-dark: #A50057;
    --color-primary-light: #FDE7F1;
    --color-primary-lighter: #FFF5FA;

    --color-ink: #1A1424;
    --color-muted: #6B6470;
    --color-bg: #FAF7F9;
    --color-surface: #FFFFFF;
    --color-border: #EAE1E6;

    --color-success-bg: #E9F8EE;
    --color-success-border: #B7E4C7;
    --color-success-text: #1E5C34;
    --color-error-bg: #FDECEA;
    --color-error-border: #F5C2C0;
    --color-error-text: #7A1F1A;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-8: 48px;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;

    --shadow-sm: 0 1px 2px rgba(26, 20, 36, 0.06);
    --shadow-md: 0 4px 16px rgba(214, 0, 111, 0.08);

    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-ink);
    line-height: 1.5;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-4) var(--space-8);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-5);
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  }

  .brand-name {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 var(--space-2);
  }

  h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 var(--space-3);
  }

  p { margin: 0 0 var(--space-3); }

  .subtitle {
    color: var(--color-muted);
    margin-bottom: var(--space-6);
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: var(--space-5);
    margin-bottom: var(--space-4);
  }

  .card + .card { margin-top: var(--space-4); }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: var(--space-4);
    margin-bottom: var(--space-1);
  }

  label:first-child { margin-top: 0; }

  input[type=text], input[type=password], input[type=number], input[type=file],
  textarea, select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 0.95rem;
    color: var(--color-ink);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    transition: border-color 0.15s ease;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-light);
  }

  textarea { min-height: 5.5rem; resize: vertical; }

  .hint {
    color: var(--color-muted);
    font-size: 0.82rem;
    margin-top: var(--space-1);
  }

  .radio-row {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    font-weight: 400;
    margin-top: var(--space-2);
  }
  .radio-row input { width: auto; }

  .choice-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-4);
  }
  @media (max-width: 600px) {
    .choice-cards { grid-template-columns: 1fr; }
  }

  .choice-card {
    border: 2px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .choice-card:hover { border-color: var(--color-primary-light); }
  .choice-card.selected {
    border-color: var(--color-primary);
    background: var(--color-primary-lighter);
  }
  .choice-card input[type=radio] { display: none; }
  .choice-card .choice-title { font-weight: 700; margin-bottom: var(--space-1); }
  .choice-card .choice-desc { color: var(--color-muted); font-size: 0.88rem; margin: 0; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 10px 20px;
    font: inherit;
    font-weight: 600;
    font-size: 0.92rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .btn:hover { filter: brightness(0.95); }

  .btn-primary {
    background: var(--color-primary);
    color: #fff;
    box-shadow: var(--shadow-md);
  }

  .btn-secondary {
    background: var(--color-surface);
    color: var(--color-ink);
    border-color: var(--color-border);
  }

  .btn-link {
    background: none;
    border: none;
    color: var(--color-primary);
    padding: 4px 0;
    font-weight: 600;
    font-size: 0.85rem;
  }

  .error-banner {
    background: var(--color-error-bg);
    border: 1px solid var(--color-error-border);
    color: var(--color-error-text);
    padding: var(--space-4);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-5);
  }
  .error-banner strong { display: block; margin-bottom: var(--space-2); }
  .error-banner ul { margin: 0; padding-left: 1.2rem; }

  .ok-banner {
    background: var(--color-success-bg);
    border: 1px solid var(--color-success-border);
    color: var(--color-success-text);
    padding: var(--space-4);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-5);
  }

  .step-layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: var(--space-6);
    align-items: start;
  }
  @media (max-width: 720px) {
    .step-layout { grid-template-columns: 1fr; }
  }

  .step-rail {
    position: sticky;
    top: var(--space-5);
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .step-rail-item {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm);
    color: var(--color-muted);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: none;
    text-align: left;
    width: 100%;
  }
  .step-rail-item .dot {
    width: 22px;
    height: 22px;
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    background: var(--color-border);
    color: var(--color-muted);
  }
  .step-rail-item.active {
    color: var(--color-ink);
    background: var(--color-primary-lighter);
  }
  .step-rail-item.active .dot {
    background: var(--color-primary);
    color: #fff;
  }
  .step-rail-item.complete .dot {
    background: var(--color-primary-dark);
    color: #fff;
  }

  .wizard-step { display: none; }
  .wizard-step.active { display: block; }

  .step-nav {
    display: flex;
    justify-content: space-between;
    margin-top: var(--space-5);
  }

  .product-row {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
    position: relative;
  }
  .product-row-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 var(--space-4);
  }
  @media (max-width: 600px) {
    .product-row-grid { grid-template-columns: 1fr; }
  }
  .product-row .remove-product {
    position: absolute;
    top: var(--space-3);
    right: var(--space-3);
    color: var(--color-muted);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.8rem;
  }

  .review-section { margin-bottom: var(--space-5); }
  .review-section h3 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-muted);
    margin: 0 0 var(--space-2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .review-row {
    display: flex;
    justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--color-border);
    font-size: 0.92rem;
  }
  .review-row:last-child { border-bottom: none; }
  .review-row .label { color: var(--color-muted); font-weight: 400; margin: 0; }
  .review-row .value { font-weight: 600; text-align: right; }

  .steps-box {
    background: var(--color-primary-lighter);
    border: 1px solid var(--color-primary-light);
    border-radius: var(--radius-md);
    padding: var(--space-4) var(--space-5);
  }
  .steps-box ol { margin: var(--space-2) 0 0 1.1rem; padding: 0; }
  .steps-box li { margin-bottom: var(--space-2); }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  table.data-table th {
    text-align: left;
    color: var(--color-muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: var(--space-2);
    border-bottom: 1px solid var(--color-border);
  }
  table.data-table td {
    padding: var(--space-2);
    border-bottom: 1px solid var(--color-border);
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
  <div class="page">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">ShopTransact</div>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
