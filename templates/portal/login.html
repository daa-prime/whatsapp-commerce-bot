{% extends "base.html" %}
{% block title %}Merchant login — ShopTransact{% endblock %}
{% block content %}

<div class="card" style="max-width: 380px; margin: var(--space-8) auto 0;">
  <h1 style="font-size: 1.3rem;">Merchant login</h1>
  <p class="subtitle" style="margin-bottom: var(--space-4);">Sign in to your ShopTransact portal.</p>

  {% if error %}
  <div class="error-banner"><strong>{{ error }}</strong></div>
  {% endif %}

  <form method="post" action="/portal/login">
    <label>WhatsApp phone number ID</label>
    <input type="text" name="whatsapp_phone_number_id" value="{{ whatsapp_phone_number_id }}" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit" class="btn btn-primary" style="margin-top: var(--space-5); width: 100%; justify-content: center;">Log in</button>
  </form>

  <p class="hint" style="margin-top: var(--space-4);">
    Don't have a password yet? Ask your ShopTransact admin to set one up for you.
  </p>
</div>

{% endblock %}
